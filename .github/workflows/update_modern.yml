name: Update Modern
on:
  schedule:
    - cron: '0 0 * * *'  # Run daily
  workflow_dispatch:

jobs:
  update-modern:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Add swap space
      run: |
        # Disable existing swap and remove swapfile if it exists
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile
        
        # Wait for any lingering processes to release filesystem resources
        sleep 2
        
        # Now create the new swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clone Jiliac MTGODecklistCache and AtomicCards.json
      run: |
        cd ../
        # Jiliac's cache, sparse checkout of the last 7 months only (full repo is ~800MB).
        # Cloned as MTG_decklistcache since tcg-research-desk expects that path.
        git clone --depth 1 --filter=blob:none --sparse https://github.com/Jiliac/MTGODecklistCache.git MTG_decklistcache
        git -C MTG_decklistcache sparse-checkout set --no-cone $(for i in $(seq 0 6); do date -d "$(date +%Y-%m-15) -$i month" +"/Tournaments/*/%Y/%m/"; done)
        curl --retry 3 --retry-delay 10 --retry-connrefused https://mtgjson.com/api/v5/AtomicCards.json > AtomicCards.json
        cd -
        
    - name: Process data
      run: |
        echo "running process_data.py Modern"
        python process_data.py Modern
        echo "zipping processed data"
        zip -r Modern.zip processed_data/

    - name: Upload processed data as artifact
      uses: actions/upload-artifact@v4
      with:
        name: modern-processed-data
        path: Modern.zip
        retention-days: 10  # Keep for 10 days, adjust as needed
        
    - name: Show artifact info
      run: |
        echo "Processed data uploaded as artifact: modern-processed-data"
        echo "Artifact contains: Modern.zip"
        ls -la Modern.zip
